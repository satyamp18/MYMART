<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYMART - Premium Fashion & Beauty Store</title>
    <meta name="description" content="Shop online at MYMART for top quality Fashion clothing, Footwear, Accessories, Skincare, and Beauty items at best Rupee prices in India.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta http-equiv="refresh" content="0; url=MYMART/index.html">
    <style>
        :root {
            --primary: #1e3c72;
            --accent: #f39c12;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 20px;
            text-align: center;
        }
        .redirect-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .logo-tag {
            background: var(--accent);
            color: #ffffff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            vertical-align: middle;
            margin-left: 6px;
        }
        .tagline {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(243, 156, 18, 0.4);
        }
        .btn:hover {
            background: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.5);
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="logo">MYMART <span class="logo-tag">INDIA</span></div>
        <div class="tagline">Everything You Need, All in One Place</div>
        <div class="spinner"></div>
        <p>Launching the shopping portal...</p>
        <a href="MYMART/index.html" class="btn" id="redirect-btn">Enter Store ➔</a>
    </div>

    <script>
        // Immediate redirection
        (function() {
            try {
                window.location.replace("MYMART/index.html");
            } catch (e) {
                window.location.href = "MYMART/index.html";
            }
        })();
    </script>
</body>
</html>
